[package]
name = "presupuestos-motos-beto"
version = "1.1.0"
description = "Generador de presupuestos de Motos Beto"
authors = ["Motos Beto"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "presupuestos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["cookies", "json"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
